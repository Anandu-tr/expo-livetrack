# Pin the SDK Robolectric emulates.
#
# WHY: Robolectric only ships runtimes for SDKs it knows about. Without this it
# defaults to the module's compileSdk — which host apps set to the latest (36 here)
# — and DefaultSdkPicker throws IllegalArgumentException before any test body runs,
# surfacing only as "initializationError" on every test in the module.
#
# 34 is the newest SDK supported by robolectric 4.12.2 (see android/build.gradle).
# Raise both together.
sdk=34
